name: Robot Framework Tests

# CI/CD Pipeline - Run tests on push/PR, upload results
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Robot Framework Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install robotframework==6.1.1 requests==2.31.0 can==4.3.1
      - name: Run tests
        run: robot --outputdir ./test-results ./tests/
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-framework-results
          path: ./test-results/
          retention-days: 30

  quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check syntax
        run: python -m py_compile libraries/__init__.py
